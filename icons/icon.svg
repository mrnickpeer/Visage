<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Dark slate background -->
    <linearGradient id="bg_visage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Warm, vibrant fiery gradient for Visage -->
    <linearGradient id="visage_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <filter id="glow_visage" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect x="0" y="0" width="128" height="128" rx="32" fill="url(#bg_visage)"/>
  
  <!-- Subtle inner glowing ring -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="url(#visage_gradient)" stroke-width="2" opacity="0.3"/>

  <!-- Bold, ultra-modern fluid 'V' representing Visage -->
  <path d="M 36 44 L 64 86 L 92 44" fill="none" stroke="url(#visage_gradient)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow_visage)"/>

  <!-- Floating interconnected node (radar ping) -->
  <circle cx="64" cy="44" r="6" fill="#ffffff" filter="url(#glow_visage)"/>
</svg>
